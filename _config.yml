# Site
title: Jiawei Xiong
tagline: AI Engineer & daydreamer
description: Jiawei Xiong builds production AI agents and RAG systems. Data science took me from Shenzhen to Chicago to San Jose.
url: "https://gavixiong.github.io"
baseurl: ""
repository: gavixiong/gavixiong.github.io
lang: en
timezone: America/Los_Angeles
logo: /assets/images/bio-photo.jpg

author:
  name: Jiawei Xiong
  email: jiaweibear02@gmail.com
  url: "https://gavixiong.github.io"

social:
  name: Jiawei Xiong
  links:
    - https://github.com/gavixiong
    - https://www.linkedin.com/in/jiawei-xiong-407a08314
    - https://www.instagram.com/sharkbear2023/

# Top navigation (_includes/nav.html)
nav:
  - { title: Work, url: "/#work", hide_sm: true }
  - { title: Blog, url: /posts/ }
  - { title: Photos, url: /photos/ }

# Content
permalink: /:categories/:title/
excerpt_separator: "\n\n"
include:
  - _pages
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Build
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
