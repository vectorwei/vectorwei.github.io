<header class="nav">
  <a class="brand" href="{{ '/' | relative_url }}">
    <img src="{{ '/assets/images/bio-photo.jpg' | relative_url }}" alt="">
    <span>gavixiong</span>
  </a>
  <nav>
    {% for item in site.nav %}
      {% assign active = false %}
      {% if item.url != '/#work' and page.url contains item.url %}{% assign active = true %}{% endif %}
      {% if item.url == '/posts/' and page.collection == 'posts' %}{% assign active = true %}{% endif %}
      <a{% if item.hide_sm %} class="hide-sm"{% endif %}{% if active %} aria-current="page"{% endif %} href="{{ item.url | relative_url }}">{{ item.title }}</a>
    {% endfor %}
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </nav>
</header>
